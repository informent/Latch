name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run check
      - run: npm run check:roles
      - run: npm run check:automation
      - run: npm run publication-check
      - run: npm run commands:check
      - run: npm run release:smoke

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag opendesk:ci .
      - name: Run isolated smoke inside hardened production image
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,size=16m,mode=1777
          opendesk:ci node scripts/release-smoke.js --container

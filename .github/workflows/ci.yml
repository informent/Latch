name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify source, tests and isolated runtime
        run: npm run release:verify -- --json --output release-evidence/verification.json
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: release-evidence/verification.json
          if-no-files-found: warn
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag opendesk:ci .
      - name: Run isolated smoke inside hardened production image
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,size=16m,mode=1777
          opendesk:ci node scripts/release-smoke.js --container
